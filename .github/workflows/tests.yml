name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore on pull_request: this check is required by the main
  # ruleset, and a path-filtered (skipped) workflow never reports, leaving
  # docs-only PRs blocked on "Waiting for status to be reported".
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install dependencies
        # Wheels only: never run a package's setup script in CI.
        run: "pip install --only-binary ':all:' -r requirements.txt -r requirements-dev.txt"
      - name: Run tests
        run: python -m pytest tests/ -q
