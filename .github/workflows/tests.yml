name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore on pull_request: this check is required by the main
  # ruleset, and a path-filtered (skipped) workflow never reports, leaving
  # docs-only PRs blocked on "Waiting for status to be reported".
  pull_request:
    branches: [main]

# Read-only token: the job only checks out code and runs tests.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        # Hash-locked (pip-compile --generate-hashes), wheels only: every
        # package, transitive ones included, must match a recorded sha256.
        run: "pip install --require-hashes --only-binary ':all:' -r requirements-dev.txt"
      - name: Run tests
        run: python -m pytest tests/ -q
