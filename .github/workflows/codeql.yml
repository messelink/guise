name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore on pull_request: this check is required by the main
  # ruleset, and a path-filtered (skipped) workflow never reports, leaving
  # docs-only PRs blocked on "Waiting for status to be reported".
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 4 * * 0'  # weekly, off-peak

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
