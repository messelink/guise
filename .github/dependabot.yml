version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Bundle action SHA bumps into a single weekly PR so it's
      # one review instead of one PR per action.
      gha-bumps:
        patterns:
          - "*"
  # Bumps pins in requirements.in and regenerates the hash-locked
  # requirements*.txt (Dependabot detects the pip-compile header).
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
  # Bumps the digest-pinned base image in server/Dockerfile.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
